<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO | Relojes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#ffffff;
color:#111;
}

header{
background:#0B1F3A;
color:white;
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:32px;
letter-spacing:3px;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-weight:bold;
}

.hero{
height:80vh;
background:linear-gradient(rgba(11,31,58,.75),rgba(11,31,58,.75)),
url("https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero h2{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
margin-bottom:30px;
}

.btn{
background:silver;
color:#0B1F3A;
padding:15px 35px;
text-decoration:none;
font-weight:bold;
border-radius:30px;
}

section{
padding:70px 10%;
}

h3{
font-size:36px;
text-align:center;
margin-bottom:40px;
color:#0B1F3A;
}

.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.tarjeta{
background:#f7f7f7;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.tarjeta img{
width:100%;
border-radius:10px;
}

.tarjeta h4{
margin:15px 0;
}

.precio{
font-size:22px;
font-weight:bold;
color:#0B1F3A;
}

footer{
background:#0B1F3A;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}
</style>

</head>

<body>

<header>
<h1>NEXO</h1>

<nav>
<a href="#">Inicio</a>
<a href="#">Colección</a>
<a href="#">Contacto</a>
</nav>

</header>

<div class="hero">

<div>
<h2>El tiempo define tu estilo</h2>
<p>Relojes elegantes para personas que buscan destacar.</p>

<a href="#" class="btn">Comprar Ahora</a>

</div>

</div>

<section>

<h3>Colección Destacada</h3>

<div class="productos">

<div class="tarjeta">
<img src="https://images.unsplash.com/photo-1547996160-81dfa63595aa?auto=format&fit=crop&w=700&q=80">
<h4>NEXO Classic</h4>
<p class="precio">149 €</p>
</div>

<div class="tarjeta">
<img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=700&q=80">
<h4>NEXO Ocean</h4>
<p class="precio">179 €</p>
</div>

<div class="tarjeta">
<img src="https://images.unsplash.com/photo-1434056886845-dac89ffe9b56?auto=format&fit=crop&w=700&q=80">
<h4>NEXO Silver</h4>
<p class="precio">199 €</p>
</div>

</div>

</section>

<footer>

<p>© 2026 NEXO - Todos los derechos reservados.</p>

</footer>

</body>
</html>
